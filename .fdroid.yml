# F-Droid build recipe for good-echo
# Fork fdroiddata (https://gitlab.com/fdroid/fdroiddata), copy this to
# metadata/com.goodecho.app.yml, and submit a merge request.

Categories:
  - Time
  - Sound & Audio

License: GPL-3.0-or-later

AuthorName: good-echo contributors
Web: https://github.com/shkarlsson/good-echo
SourceCode: https://github.com/shkarlsson/good-echo
IssueTracker: https://github.com/shkarlsson/good-echo/issues

AutoName: good-echo
Description: |-
  Continuously record audio for retrieval at a later time.
  Unless saved, recordings are deleted on a rolling basis.

  * record harassment and bullying (even when you didn't anticipated them)
  * save important pieces of information (phone numbers / passwords /
    instructions)
  * record cute/funny moments
  * prove that someone said (or didn't say) something

  This is a fork of Echo by Marek Rogalski (mafik), with Opus encoding,
  compressed in-memory history, and UI refinements.

RepoType: git
Repo: https://github.com/shkarlsson/good-echo.git

Builds:
  - versionName: 2.0.0
    versionCode: 15
    commit: master
    subdir: SaidIt
    gradle:
      - yes
    gradleprops:
      - android.useAndroidX=true
    build: yes
    scandelete:
      - SaidIt/libs
      - SaidIt/src/main/java/simplesound
      - SaidIt/src/main/assets/public_key.der

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: build.gradle|versionCode (\d+)|.|versionName "([^"]+)"
CurrentVersion: 2.0.0
CurrentVersionCode: 15
